<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>骰寶記錄</title>
  
  <script>
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>

  <header class="app-header">
    <h2>骰寶記錄</h2>
    <button id="theme-toggle" class="theme-btn" aria-label="切換主題">☾</button>
  </header>

  <main class="app-container">
    
    <aside class="left-panel">
      <section class="card balance-container">
        <div class="card-title text-center">目前盈虧</div>
        <div id="balanceDisplay" class="balance-amount neutral">$0</div>
        
        <div class="stats-grid">
          <div class="stat-box">
            <div class="stat-title">局數</div>
            <div class="stat-value" id="stat-count">0</div>
          </div>
          <div class="stat-box">
            <div class="stat-title">勝率</div>
            <div class="stat-value" id="stat-winrate">0.0%</div>
          </div>
          <div class="stat-box">
            <div class="stat-title">ROI</div>
            <div class="stat-value" id="stat-roi">0.0%</div>
          </div>
          <div class="stat-box">
            <div class="stat-title">總投注額</div>
            <div class="stat-value" id="stat-wager">$0</div>
          </div>
          <div class="stat-box">
            <div class="stat-title">勝出數</div>
            <div class="stat-value win-text" id="stat-win">0</div>
          </div>
          <div class="stat-box">
            <div class="stat-title">落敗數</div>
            <div class="stat-value lose-text" id="stat-lose">0</div>
          </div>
        </div>
      </section>

      <section class="card history-card">
        <div class="card-title">歷史紀錄</div>
        <div id="historyList" class="history-container">
          <div id="emptyMsg" class="empty-msg">目前尚無紀錄</div>
        </div>
      </section>
    </aside>

    <section class="right-panel">
      
      <div class="card bet-card">
        <div class="card-title">投注選項</div>
        <div class="bet-options" id="betOptions">
          <button class="bet-btn active" data-type="大">大</button>
          <button class="bet-btn" data-type="細">細</button>
          <button class="bet-btn" data-type="圍骰">圍骰</button>
        </div>
        <button class="roll-btn" id="btn-roll">🎲 擲骰權</button>
      </div>

      <div class="card amount-card">
        <div class="card-title amount-header">
          <span>投注金額</span>
          <span class="current-bet-label">目前投注</span>
        </div>
        <div class="amount-display">$<span id="currentAmount">0</span></div>
        <div class="amount-btns" id="amountBtns">
          <button class="amt-btn" data-val="10">+$10</button>
          <button class="amt-btn" data-val="50">+$50</button>
          <button class="amt-btn" data-val="100">+$100</button>
          <button class="amt-btn btn-outline" id="btnClear">重置金額</button>
        </div>
      </div>

      <div class="card keypad-card">
        <div class="card-title">開彩結果</div>
        <div class="dice-display-area">
          <div class="dice-slot" id="dice-0"></div>
          <div class="dice-slot" id="dice-1"></div>
          <div class="dice-slot" id="dice-2"></div>
        </div>
        <div class="dice-keypad" id="diceKeypad">
          <button class="key-btn" data-num="1">
            <svg class="dice-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"></rect><circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"></circle></svg>
          </button>
          <button class="key-btn" data-num="2">
            <svg class="dice-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"></rect><circle cx="8" cy="8" r="1.5" fill="currentColor" stroke="none"></circle><circle cx="16" cy="16" r="1.5" fill="currentColor" stroke="none"></circle></svg>
          </button>
          <button class="key-btn" data-num="3">
            <svg class="dice-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"></rect><circle cx="8" cy="8" r="1.5" fill="currentColor" stroke="none"></circle><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"></circle><circle cx="16" cy="16" r="1.5" fill="currentColor" stroke="none"></circle></svg>
          </button>
          <button class="key-btn" data-num="4">
            <svg class="dice-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"></rect><circle cx="8" cy="8" r="1.5" fill="currentColor" stroke="none"></circle><circle cx="16" cy="8" r="1.5" fill="currentColor" stroke="none"></circle><circle cx="8" cy="16" r="1.5" fill="currentColor" stroke="none"></circle><circle cx="16" cy="16" r="1.5" fill="currentColor" stroke="none"></circle></svg>
          </button>
          <button class="key-btn" data-num="5">
            <svg class="dice-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"></rect><circle cx="8" cy="8" r="1.5" fill="currentColor" stroke="none"></circle><circle cx="16" cy="8" r="1.5" fill="currentColor" stroke="none"></circle><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"></circle><circle cx="8" cy="16" r="1.5" fill="currentColor" stroke="none"></circle><circle cx="16" cy="16" r="1.5" fill="currentColor" stroke="none"></circle></svg>
          </button>
          <button class="key-btn" data-num="6">
            <svg class="dice-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"></rect><circle cx="8" cy="8" r="1.5" fill="currentColor" stroke="none"></circle><circle cx="16" cy="8" r="1.5" fill="currentColor" stroke="none"></circle><circle cx="8" cy="12" r="1.5" fill="currentColor" stroke="none"></circle><circle cx="16" cy="12" r="1.5" fill="currentColor" stroke="none"></circle><circle cx="8" cy="16" r="1.5" fill="currentColor" stroke="none"></circle><circle cx="16" cy="16" r="1.5" fill="currentColor" stroke="none"></circle></svg>
          </button>
          <button class="key-btn btn-outline-red" id="btnDeleteDice">刪除</button>
          <button class="key-btn key-submit" id="btnSubmit" disabled>確認並結算</button>
        </div>
      </div>

    </section>
  </main>

  <footer class="app-footer">
    Credit by AL
  </footer>

</body>
</html>
